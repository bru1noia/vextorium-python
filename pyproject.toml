[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vextorium"
version = "0.1.1"
description = "550+ pay-per-call data services for trading bots and AI agents, paid automatically in USDC on Base via x402. No API keys."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["x402[evm]>=2.25", "requests>=2.28", "eth-account>=0.10"]
keywords = ["x402", "usdc", "base", "trading", "freqtrade", "crypto", "funding-rate", "liquidations", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [{ name = "Vextorium" }]

[project.optional-dependencies]
freqtrade = ["pandas"]

[project.urls]
Homepage = "https://vextorium.com"
Documentation = "https://github.com/bru1noia/vextorium-python#readme"
Catalog = "https://api.vextorium.com/catalog.json"
OpenAPI = "https://api.vextorium.com/openapi.json"
"MCP server" = "https://github.com/bru1noia/vextorium-mcp"
Source = "https://github.com/bru1noia/vextorium-python"
Issues = "https://github.com/bru1noia/vextorium-python/issues"
